    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- State Management ---
        let currentPinCode = localStorage.getItem('cryptodash_pin') || "1234";
        let isManageUnlocked = false;
        let currentCurrency = 'USD'; // 'USD' | 'TRY'
        let usdToTryRate = 34.50;
        let currentTheme = 'light'; 
        let activeFilterView = 'all'; // 'all' | 'bought' | 'sold'
        let activeDesignPreset = localStorage.getItem('cryptodash_preset') || 'ventic';

        // ... existing state & data ...

        // --- Window Initialization ---
        window.onload = function() {
            lucide.createIcons();
            initDateInput();
            initCharts();
            
            // Apply Saved Preset
            document.getElementById('preset-selector').value = activeDesignPreset;
            applyDesignPreset(activeDesignPreset, false);

            loadUserProfile();

            fetchBinancePrices();
            setInterval(fetchBinancePrices, 5000);

            updateDashboard();
        };

        // --- Design Preset Switcher Engine ---
        function applyDesignPreset(presetKey, save = true) {
            activeDesignPreset = presetKey;
            const html = document.documentElement;
            
            if (save) {
                localStorage.setItem('cryptodash_preset', presetKey);
            }

            html.setAttribute('data-preset', presetKey);

            // Handle dark/light base class for presets
            if (presetKey === 'cyber' || presetKey === 'sunset') {
                html.classList.remove('light');
                html.classList.add('dark');
                currentTheme = 'dark';
            } else if (presetKey === 'royal' || presetKey === 'mono') {
                html.classList.remove('dark');
                html.classList.add('light');
                currentTheme = 'light';
            }

            // Sync preset dynamic chart colors
            if (trendChartInstance && trendChartInstance.data.datasets.length >= 2) {
                if (presetKey === 'cyber') {
                    trendChartInstance.data.datasets[0].borderColor = '#06B6D4';
                    trendChartInstance.data.datasets[0].backgroundColor = 'rgba(6, 182, 212, 0.1)';
                    trendChartInstance.data.datasets[1].borderColor = '#6366F1';
                } else if (presetKey === 'sunset') {
                    trendChartInstance.data.datasets[0].borderColor = '#F59E0B';
                    trendChartInstance.data.datasets[0].backgroundColor = 'rgba(245, 158, 11, 0.1)';
                    trendChartInstance.data.datasets[1].borderColor = '#F97316';
                } else if (presetKey === 'royal') {
                    trendChartInstance.data.datasets[0].borderColor = '#4F46E5';
                    trendChartInstance.data.datasets[0].backgroundColor = 'rgba(79, 70, 229, 0.1)';
                    trendChartInstance.data.datasets[1].borderColor = '#0EA5E9';
                } else if (presetKey === 'mono') {
                    trendChartInstance.data.datasets[0].borderColor = '#000000';
                    trendChartInstance.data.datasets[0].backgroundColor = 'rgba(0, 0, 0, 0.05)';
                    trendChartInstance.data.datasets[1].borderColor = '#666666';
                } else {
                    trendChartInstance.data.datasets[0].borderColor = '#10B981';
                    trendChartInstance.data.datasets[0].backgroundColor = 'rgba(16, 185, 129, 0.1)';
                    trendChartInstance.data.datasets[1].borderColor = '#6366F1';
                }
                trendChartInstance.update();
            }

            updateChartsTheme();
            showToast(`Tasarım "${presetKey.toUpperCase()}" temasına değiştirildi.`);
        }

        // ... existing logic ...
    </script>
